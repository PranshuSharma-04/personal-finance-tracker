
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction | FinanceFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="brand">FinanceFlow</div>
        <nav>
            <a href="{{ url_for('dashboard') }}" class="nav-link">Dashboard</a>
            <a href="{{ url_for('transactions') }}" class="nav-link active">Transactions</a>
        </nav>
        <div class="sidebar-bottom">
            <p>Personal Finance Tracker</p>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Edit Transaction</h1>
                <p>Update your financial record.</p>
            </div>
        </header>

        <section class="panel">
            <form action="{{ url_for('update_transaction', transaction_id=transaction.transaction_id) }}"
                  method="POST" class="transaction-form">

                <div class="form-group">
                    <label>Transaction Type</label>
                    <select name="transaction_type" required>
                        <option value="income" {% if transaction.transaction_type == 'income' %}selected{% endif %}>Income</option>
                        <option value="expense" {% if transaction.transaction_type == 'expense' %}selected{% endif %}>Expense</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" name="amount"
                           value="{{ transaction.amount }}" step="0.01" min="0.01" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <input type="text" name="category"
                           value="{{ transaction.category }}" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <input type="text" name="description"
                           value="{{ transaction.description or '' }}">
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="transaction_date"
                           value="{{ transaction.transaction_date }}" required>
                </div>

                <button type="submit" class="primary-button">Save Changes</button>
                <a href="{{ url_for('transactions') }}" class="nav-link">Cancel</a>

            </form>
        </section>

    </main>
</div>

</body>
</html>
